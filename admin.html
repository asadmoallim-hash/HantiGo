html:root{--bg:#0b1118;--surface:#141c26;--ink:#eef3f8;--muted:#8fa0b3;--line:#233041;--accent:#3ddc97;--accent-soft:#16352a;--in:#3ddc97;--in-soft:#14322a;--out:#ff7a66;--out-soft:#3a1f1b;color-scheme:dark}

.tabs{grid-template-columns:repeat(3,1fr)}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}

.stw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.stbl th{position:sticky;top:0;background:#1b2633;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 10px}

.sgrp button{border:0;background:transparent;min-height:34px;color:var(--muted)}.sgrp button[aria-pressed=true]{background:var(--accent);color:#06281a}
@media (max-width:560px){.scount{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* every button group: the pressed one is highlighted and stays active */
.chips button[aria-pressed=true],.sgrp button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#06281a;box-shadow:0 0 0 2px rgba(61,220,151,.25)}
.chips button[aria-pressed=false]:hover,.sgrp button[aria-pressed=false]:hover,.tabs button[aria-selected=false]:hover{color:var(--ink)}
/* period tiles (Macaamiil cusub, Lacag-bixinta tooska ah) are buttons */
.ncount button{min-height:0;font:inherit;color:inherit;width:100%;cursor:pointer;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;transition:background .15s,border-color .15s}
.autobox .ncount button{background:rgba(31,157,85,.1)}
.ncount button:hover{border-color:var(--accent)}
.ncount button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,220,151,.25)}
.ncount button[aria-pressed=true] b,.ncount button[aria-pressed=true] small{color:#06281a}
.ncount.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:560px){.ncount.n5{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* top count tiles are buttons: tap one to open that customer list; the chosen one stays lit */
button.stat{font:inherit;color:inherit;text-align:start;cursor:pointer;display:block;width:100%;transition:border-color .15s,box-shadow .15s}
button.stat:hover{border-color:var(--accent)}
button.stat[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,220,151,.35);outline:0}
button.stat[aria-pressed=true] small{color:var(--accent)}
.plist-h{margin:0;font-size:.9rem;color:var(--muted);font-weight:600}
/* v132 phone: tables as cards */
@media (max-width:639px){
  .stw{overflow:visible;border:0}
  .stbl,.stbl tbody{display:block;min-width:0!important}
  .stbl tr:first-child:has(th){display:none}
  .stbl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px 14px;margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .stbl td{display:flex;flex-direction:column;gap:1px;padding:0!important;border:0!important;min-width:0!important;white-space:normal!important;text-align:start!important;overflow-wrap:anywhere}

}

<body>
<div class="wrap">
  <div class="top"><h1>Hanti<span>Go</span> · Maamul</h1><a href="./">← Ku noqo app-ka</a></div>
  <p class="msg" id="msg">Waa la soo dejinayaa…</p>

    <section id="reqs" class="reqs" hidden></section>

    <section id="newbox" class="newbox" aria-live="polite"></section>

<script>
const sb=supabase.createClient("https://izcvgigmcqxkntsvxkhj.supabase.co","sb_publishable_Uzpl7gYnsQAvLVwvsyD7nA_ZhJt_XpZ");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString("en-GB"):"—";
let rows=[];
/* price by account type: Shakhsi $3, Shirkad $7 (Shirkad includes Shakhsi) */
const PRICE={person:3,business:7};
// a pending request is priced by what the customer chose on the payment screen ([Shakhsi $3] / [Shirkad $7]); approving it sets profiles.plan to that choice
const tagPlan=p=>/\[Shirkad/i.test(p.pay_ref||"")?"business":/\[Shakhsi/i.test(p.pay_ref||"")?"person":null;
const planOf=p=>(p.pay_status==="pending"&&tagPlan(p))||(p.plan?(p.plan==="business"?"business":"person"):tagPlan(p));
const priceOf=p=>PRICE[planOf(p)||"person"];
const planName=p=>planOf(p)==="business"?"Shirkad":"Shakhsi";
const accLink=p=>"https://hantigoapp.github.io/?open="+(planOf(p)==="business"?"business":"person");   // opens the customer's Shakhsi or Shirkad account
const planPill=p=>{const k=planOf(p);return `<span class="pill ${k==="business"?"biz":"per"}">${k?(k==="business"?"🏢 Shirkad $7":"👤 Shakhsi $3"):"? Nooc lama oga"}</span>`};
const cleanRef=r=>String(r||"").replace(/^(\[[^\]]*\]\s*)+/,"");
const payWay=p=>/\[WaafiPay\]/i.test(p.pay_ref||"")?"WaafiPay":"EVC Plus";
function status(p){const now=new Date();
  if(p.is_admin)return["Maamule","ok"];
  if(p.paid_until&&new Date(p.paid_until)>now)return["Bixiyay ilaa "+fmt(p.paid_until),"ok"];
  if(new Date(p.trial_until)>now)return["Tijaabo ilaa "+fmt(p.trial_until),"trial"];
  return["Dhacay","warn"]}
let filt="all",tab="cust",grp="all",locCountry="",locCity="";
const isBiz=p=>planOf(p)==="business";
const GROUPS=[["person","👤 Shakhsi",p=>!isBiz(p)],["business","🏢 Shirkad",isBiz]];
const isPaid=p=>p.paid_until&&new Date(p.paid_until)>new Date();
const isTrial=p=>!isPaid(p)&&new Date(p.trial_until)>new Date();
const isNew=p=>p.created_at&&Date.now()-new Date(p.created_at)<7*864e5;
/* last sign-in (auth.users) and last time the app saved their data (user_data), from customer_info.sql */
const signInAt=p=>info[p.id]?.last_sign_in_at||extra[p.id]?.last_seen||null;
const dataAt=p=>info[p.id]?.data_updated_at||null;
const activeAt=p=>{const a=[signInAt(p),dataAt(p)].filter(Boolean).map(d=>+new Date(d));return a.length?Math.max(...a):0};
const isToday=t=>{const d=new Date();d.setHours(0,0,0,0);return t>=+d};
const FILTERS=[["all","Dhammaan",()=>true],["paid","Bixiyay",isPaid],["trial","Tijaabo",isTrial],["exp","Dhacay",p=>!isPaid(p)&&!isTrial(p)],["new","Cusub (7 maalmood)",isNew],["today","🟢 Maanta galay",p=>isToday(activeAt(p))]];
function custRow(p){const [t,c]=status(p);return `<div class="row">
    <div class="av" aria-hidden="true">${initial(p)}</div>
    <div class="who"><b>${esc(nameOf(p)||p.email)}</b><span class="pill ${c}">${esc(t)}</span>${planPill(p)}
